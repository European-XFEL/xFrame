structure_name: 'tutorial'
dimensions: 3
particle_radius: 230

grid:
  n_radial_points:
    command: (1024,128)
  max_order: 31
  n_phi: 64
  n_theta: 32
  max_nonzero_r:
    command: '2.5'
    
density_guess:
  type: bump
  bump:
    slope: 0.5
  amplitude_function: random
  random:
    SNR: 1
  radius: 230

projections:
  reciprocal:
    use_averaged_intensity: true
    use_real_spherical_harmonics: False
    q_mask:
      type: from_projection_matrices
    used_order_ids:
      command: np.arange(31)
    regrid:
      interpolation: cubic
    odd_orders_to_0: true
    SO_freedom:
      use: false
multi_process:
  n_parallel_reconstructions: 1 # 'auto' 
  use: True
  n_weight_generating_processes: false
GPU:
  use: True
  n_gpu_workers:
    command: max(Multiprocessing.free_cpus//10,1)
main_loop:
  sub_loops:
    order:
    - prepare
    - main
    prepare:
      projections:
        real:
          apply:
            - support
            - center
            - real
            - positivity
          support:
            type: support_by_volume
            options:
              max_radius: 240
              volume_limits:
                command: "(1e6,np.inf)"
              collect_metrics:
                - support
                - contrast_history
                - volume_history
                - distance_mask
          center:
            type: centering
            options:
              activation_distance: 30
              offset: 
                command: "np.array([0.0,0.0,0.0])"
              collect_metrics:
                - center_history
          real:
            type: realness
          positivity:
            type: positivity
            
      methods:
        duglas_rachford:
          iterations: 60
          ft_stab: True
          beta: 0.5
        error_reduction:
          iterations: 20
          ft_stab: false
      iterations: 3
      order:
        - duglas_rachford
        - error_reduction
    main:
      projections:
        real:
          apply:
            - support
            - center
            - real
            - positivity
          support:
            type: support_by_volume
            options:
              max_radius: 240
              volume_limits:
                command: "(1e6,np.inf)"
              collect_metrics:
                - support
                - contrast_history
                - volume_history
                - distance_mask
          center:
            type: centering
            options:
              activation_distance: 30
              offset: 
                command: "np.array([0.0,0.0,0.0])"
              collect_metrics:
                - center_history
          real:
            type: realness
          positivity:
            type: positivity
      methods:
        duglas_rachford:
          iterations: 30
          ft_stab: True
          beta: 0.5
        error_reduction:
          iterations: 20
          ft_stab: True
      iterations: 6
      order:
        - duglas_rachford
        - error_reduction
