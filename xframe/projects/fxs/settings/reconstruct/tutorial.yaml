structure_name: 'tutorial'
dimensions: 3
particle_radius: 200

grid:
  n_radial_points:
    command: (2048,256)
  max_order: 63
  n_phi: 128
  n_theta: 64
  max_nonzero_r:
    command: '2.5'
    
density_guess:
  type: bump
  bump:
    slope: 0.5
  amplitude_function: random
  random:
    SNR: 1

projections:
  real:
    projections:
      apply:
      - support_snr
      support_snr:
        initial_volume: 1e6
        volume_step: 25000
        force_connected: False        
  reciprocal:
    use_averaged_intensity: true
    use_real_spherical_harmonics: False
    q_mask:
      type: from_projection_matrices
    used_order_ids:
      command: np.arange(64)
    regrid:
      interpolation: cubic
    odd_orders_to_0: true
    SO_freedom:
      use: false
multi_process:
  n_parallel_reconstructions: 1 # 'auto' 
  use: True
  n_weight_generating_processes: false
GPU:
  use: True
  n_gpu_workers:
    command: max(Multiprocessing.free_cpus//10,1)
main_loop:
  sub_loops:
    order:
    - main
    - refinement
    main:
      methods:
        duglas_rachford:
          iterations: 20
          ft_stab: true
          beta: 1
      iterations: 3
      order:
        - duglas_rachford
    refinement:
      methods:
        error_reduction:
          iterations: 10
          ft_stab: false
      iterations: 0
      order:
        - error_reduction
