structure_name: 'tutorial'
dimensions: 3
particle_radius: 200

grid:
  n_radial_points:
    command: (1024,128)
  max_order: 31
  n_phi: 64
  n_theta: 32
  max_nonzero_r:
    command: '2'
    
density_guess:
  type: bump
  bump:
    slope: 0.5
  amplitude_function: random
  random:
    SNR: 1
  radius: 230

projections:
  real:
    apply:
      - support_snr
    support_snr:
      initial_volume: 9e6
      volume_step: 1e4
      max_radius: 300
      volume_limits:
        - 5e6
        - 10e6
      force_connected: False        
  reciprocal:
    use_averaged_intensity: true
    use_real_spherical_harmonics: False
    q_mask:
      type: from_projection_matrices
    used_order_ids:
      command: np.arange(31)
    regrid:
      interpolation: cubic
    odd_orders_to_0: true
    SO_freedom:
      use: false
multi_process:
  n_parallel_reconstructions: 1 # 'auto' 
  use: True
  n_weight_generating_processes: false
GPU:
  use: True
  n_gpu_workers:
    command: max(Multiprocessing.free_cpus//10,1)
main_loop:
  sub_loops:
    order:
    - prepare
    - main
    - refinement
    prepare:
      projections:
        real:
          apply:
            - support_snr
          support_snr:
            initial_volume: 10e6
            volume_step: 1e5
            max_radius: 250
            volume_limits:
              - 6e6
              - 21e6
            force_connected: False
      methods:
        duglas_rachford:
          iterations: 20
          ft_stab: True
          beta: 0.5
        error_reduction:
          iterations: 10
          ft_stab: false
      iterations: 5
      order:
        - duglas_rachford
        - error_reduction
    main:
      projections:
        real:
          apply:
            - support_snr
          support_snr:
            initial_volume: 20e6
            volume_step: 1e5
            max_radius: 230
            volume_limits:
              - 5e6
              - 20e6
            force_connected: False            
      methods:
        duglas_rachford:
          iterations: 20
          ft_stab: False
          beta: 0.5
      iterations: 0
      order:
        - duglas_rachford
    refinement:
      methods:
        error_reduction:
          iterations: 20
          ft_stab: False
      iterations: 0
      order:
        - error_reduction
