structure_name: 'tutorial'
dimensions: 3
particle_radius: 230

grid:
  n_radial_points:
    command: (1024,128)
  max_order: 31
  n_phi: 64
  n_theta: 32
  max_nonzero_r:
    command: '2.5'
    
density_guess:
  type: bump
  bump:
    slope: 0.5
  amplitude_function: random
  random:
    SNR: 1
  radius: 230

projections:
  reciprocal:
    use_averaged_intensity: true
    use_real_spherical_harmonics: False
    q_mask:
      type: from_projection_matrices
    used_order_ids:
      command: np.arange(32)
    regrid:
      interpolation: cubic
    odd_orders_to_0: true
    SO_freedom:
      use: false
multi_process:
  n_parallel_reconstructions: 3 # 'auto' 
  use: True
  n_weight_generating_processes: false
GPU:
  use: False
  n_gpu_workers:
    command: max(Multiprocessing.free_cpus//10,1)
main_loop:
  sub_loops:
    order:
    - prepare
    #- main
    prepare:
      projections:
        real:
          apply:
            #- supp
            - supp_swc
            - center
            #- supp_sw
            - real
            - positivity
          supp:
            type: support_by_volume
            options:
              max_radius: 240
              volume_limits:
                command: "(1e6,np.inf)"
              #gaussian_sigma: 10.0
              force_connected: True
              metrics_to_save:
                support: last
                contrast: history
                volume: history
                distance_mask: last
                connected_counts: last
                contrast_function: last
          supp_swc:
            type: contrast_shrink_wrap_support
            options:
              max_radius: 240
              sw_threshold_limits:
                command: "(0.01,np.inf)"
              sw_sigma: 2
              force_connected: False
              metrics_to_save:
                support: last
                sw_threshold: history
                distance_mask: last
                contrast_function: last                
          supp_sw:
            type: shrink_wrap_support
            options:
              max_radius: 240
              sw_sigma: 10
              sw_threshold: 0.09
              metrics_to_save:
                support: last
                initial_support: last
                distance_mask: last
          center:
            type: centering
            options:
              activation_distance: 30
              offset: 
                command: "np.array([0.0,0.0,0.0])"
              metrics_to_save:
                center: history
          real:
            type: realness
          positivity:
            type: positivity
            
      methods:
        DR:
          iterations: 30
          ft_stab: True
          beta: 0.5
        HIO:
          iterations: 60
          ft_stab: True
          beta: 0.5
        SW:
          iterations: 1
        ER:
          iterations: 10
          ft_stab: false
      iterations: 6
      order:
        - DR
        #- HIO
        - ER
    main:
      projections:
        real:
          apply:
            - supp
            - center
            - real
            - positivity
          supp:
            type: support_by_volume
            options:
              max_radius: 240
              volume_limits:
                command: "(1e6,np.inf)"
              metrics_to_save:
                support: last
                contrast: history
                volume: history
                distance_mask: last
          center:
            type: centering
            options:
              activation_distance: 30
              offset: 
                command: "np.array([0.0,0.0,0.0])"
              metrics_to_save:
                center: history
          real:
            type: realness
          positivity:
            type: positivity
      methods:
        duglas_rachford:
          iterations: 30
          ft_stab: True
          beta: 0.5
        error_reduction:
          iterations: 20
          ft_stab: True
      iterations: 3
      order:
        - duglas_rachford
        - error_reduction
